name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" plip==3.0.1

      # Repository-wide Ruff debt predates this branch. Enforce clean Python
      # files changed by each PR or push while the legacy files are cleaned up.
      - name: List changed Python files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            git diff --diff-filter=ACMRT --name-only "origin/$GITHUB_BASE_REF...HEAD" -- '*.py' > changed-python.txt
          else
            git diff --diff-filter=ACMRT --name-only HEAD^ HEAD -- '*.py' > changed-python.txt
          fi
          cat changed-python.txt

      - name: Check formatting (ruff)
        run: |
          if [ -s changed-python.txt ]; then
            xargs -d '\n' ruff format --check < changed-python.txt
          fi

      - name: Lint (ruff)
        run: |
          if [ -s changed-python.txt ]; then
            xargs -d '\n' ruff check < changed-python.txt
          fi

      - name: Run tests
        run: pytest

  prod-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies only
        run: pip install .
      - name: Import smoke test (production deps only)
        run: python scripts/smoke_prod_imports.py
