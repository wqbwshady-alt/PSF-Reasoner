name: Cloud Build Verification

on:
  push:
    branches: [main]
    paths:
      - "cloud/Dockerfile"
      - "cloud/server.py"
      - "cloud/requirements.txt"
      - "cloud/.gcloudignore"
  pull_request:
    branches: [main]
    paths:
      - "cloud/Dockerfile"
      - "cloud/server.py"
      - "cloud/requirements.txt"
      - "cloud/.gcloudignore"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cloud Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./cloud
          push: false
          tags: psf-cloud-compute:ci
